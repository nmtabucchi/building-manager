[project]
name = "building-manager-backend"
version = "0.2.0"
description = "Building Manager AI - backend FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.9",
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "langchain-text-splitters>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requiere Supabase local"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
