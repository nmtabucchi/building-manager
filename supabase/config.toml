# Configuración mínima de Supabase CLI para entorno local (supabase start).
# Generada a mano; `supabase init` la ampliará con el resto de opciones por defecto.
project_id = "building-manager"

[api]
enabled = true
port = 54321
# Solo `public` se expone: el esquema `app` (tablas) queda fuera de la API REST.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "20MiB"
